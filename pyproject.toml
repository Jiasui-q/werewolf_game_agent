[project]
name = "werewolf-game-agent"
version = "0.1.0"
description = "Tau-Bench-friendly Werewolf agent evaluation harness."
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "google-generativeai==0.8.3",
    "fastapi==0.120.3",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.11.3",
    "earthshaker==0.2.1",
    "typer>=0.20.0,<0.21",
    "pydantic-settings>=2.11.0,<2.12",
    "openai>=2.13.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "green_agent",
    "green_agent.*",
    "white_agent",
    "white_agent.*",
    "werewolf_game_agent",
    "werewolf_game_agent.*",
]

[tool.setuptools.package-dir]
"" = "src"
