name = "werewolf_green_agent"
description = "Assessment hosting agent for the Werewolf evaluation harness."
version = "0.1.0"

defaultInputModes = ["text"]
defaultOutputModes = ["text"]
[capabilities]
streaming = false

[[skills]]
id = "host_assess_werewolf_game"
name = "Werewolf assessment hosting"
description = """
Run the Werewolf evaluation by wrapping the white agent, collecting statements/votes, and scoring the result. The remote white agent is given a random role; the remaining five seats are filled by NPCs controlled by the green agent.
"""
tags = ["green agent", "assessment hosting", "werewolf"]
examples = ["""
Your task is to instantiate the werewolf game environment to test the agent located at:
<white_agent_url>
http://localhost:9002/
</white_agent_url>
You should use the following env configuration:
<env_config>
{
  "env": "werewolf",
  "players": ["Alice", "Bob", "Charlie", "David", "Eva", "Frank"],
  "remote_player_name": "Remote"
}
</env_config>
"""]
